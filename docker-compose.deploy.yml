x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-marketplace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-marketplace}
    volumes:
      - postgres_deploy_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-marketplace} -d ${DB_NAME:-marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 150

  backend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.deploy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-marketplace}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-marketplace}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 5000
      TS_NODE_TRANSPILE_ONLY: "true"
    command: >
      sh -c "npm run migration:run &&
      node -r ts-node/register -r tsconfig-paths/register src/shared/http/server.ts"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app
      - data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cpus: 1.0
    mem_limit: 384m
    mem_reservation: 96m
    pids_limit: 100

  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile.deploy
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
    cap_drop:
      - ALL
    cpus: 0.50
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app:
  data:
    internal: true

volumes:
  postgres_deploy_data:
